[package]
name        = "logo-parser"
version     = "1.0.1"
authors     = ["CELESTIFYX Team <celestifyx@gmail.com>"]
edition     = "2024"
license     = "GPL-3.0-or-later"
description = "A library for parsing custom logo and color configurations from JSON5 files for LynxFetch"
repository  = "https://gitlab.com/lynxfetch/logo-parser"

[dependencies]
json5 = "1.3.1"
chromakitx = "1.0.2"

[dependencies.serde]
version = "1.0.229"
features = ["derive"]

[lints.clippy]
needless_borrow = "allow"
